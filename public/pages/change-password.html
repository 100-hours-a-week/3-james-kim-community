<!-- /public/pages/change-password.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 수정 - 커뮤니티</title>
    
    <!-- 공통 CSS 로드 -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">

    <!-- 필요한 컴포넌트 CSS 로드 -->
    <link rel="stylesheet" href="../css/components/header.css">
    <link rel="stylesheet" href="../css/components/dropdown.css">

    <!-- 페이지 전용 CSS 로드 -->
    <link rel="stylesheet" href="../css/pages/change-password.css">
</head>
<body>
    <!-- 전체 배경 -->
    <div class="app-background">
        
        <!-- 중앙 컨텐츠 컨테이너 -->
        <div class="mobile-container">

            <!-- 헤더 영역: 뒤로 가기, 커뮤니티 타이틀, 프로필 메뉴 드롭다운 -->
            <header class="page-header">
                <!-- 뒤로가기 버튼 -->
                <button class="btn-back" id="btnBack" aria-label="뒤로가기">
                    <span class="icon-back">&lt;</span>
                </button>

                <!-- 커뮤니티 이름 -->
                <h1 class="header-title">커뮤니티</h1>

                <!-- 프로필 메뉴 드롭다운-->
                <div class="profile-menu">
                    <button class="profile-button" id="profileButton" aria-label="프로필 메뉴">
                        <div class="profile-placeholder" id="profilePlaceholder"></div>
                    </button>
                    
                    <!-- 드롭다운 메뉴 -->
                    <div class="dropdown-menu hidden" id="dropdownMenu">
                        <a href="/pages/edit-profile.html" class="dropdown-item">회원정보수정</a>
                        <a href="/pages/change-password.html" class="dropdown-item">비밀번호수정</a>
                        <button class="dropdown-item" id="btnLogout">로그아웃</button>
                    </div>
                </div>
            </header>

            <!-- 메인 콘텐츠 영역 -->
            <main class="main-content">

                <!-- 비밀번호수정 헤더 섹션 -->
                <section class="change-password-header-section">
                    <h2 class="section-title">비밀번호수정</h2>
                </section>

                <!-- 비밀번호 수정 폼 -->
                <form class="change-password-form" id="changePasswordForm">
                    
                    <!-- 비밀번호 섹션 -->
                    <section class="form-section">
                        <label for="passwordInput" class="form-label">비밀번호</label>
                        <input 
                            type="password" 
                            id="passwordInput" 
                            name="password"
                            class="form-input" 
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="new-password"
                            required>
                        <div class="form-error hidden" id="passwordError"></div>
                    </section>

                    <!-- 비밀번호 확인 섹션 -->
                    <section class="form-section">
                        <label for="passwordConfirmInput" class="form-label">비밀번호 확인</label>
                        <input 
                            type="password" 
                            id="passwordConfirmInput" 
                            name="passwordConfirm"
                            class="form-input" 
                            placeholder="비밀번호를 한번 더 입력하세요"
                            autocomplete="new-password"
                            required>
                        <div class="form-error hidden" id="passwordConfirmError"></div>
                    </section>

                    <!-- 수정하기 버튼 -->
                    <button type="submit" class="btn-submit" id="btnSubmit" disabled>
                        수정하기
                    </button>

                </form>

            </main>

        </div>

    </div>

    <!-- 토스트 메시지 -->
    <div class="toast-message hidden" id="toastMessage">
        비밀번호가 수정되었습니다
    </div>

    <!-- JS 로드 -->
    <script type="module" src="../js/pages/change-password.js"></script>
</body>
</html>
