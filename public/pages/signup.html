<!-- /public/pages/signup.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 회원가입</title>

    <!-- CSS 로드 -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/pages/signup.css">
</head>
<body>
    <!-- 전체 배경 (건물 이미지) -->
    <div class="app-background">

        <!-- 중앙 컨텐츠 컨테이너 (모바일 친화적 UI) -->
        <div class="mobile-container">

            <!-- Header: 뒤로가기 + "커뮤니티" 타이틀 -->
            <header class="page-header">
                <button class="btn-back" id="backButton">
                    <span class="icon-back">←</span>
                </button>
                <h1 class="header-title">커뮤니티</h1>
            </header>
            
            <!-- 메인 콘텐츠 영역 -->
            <main class="main-content">

                <!-- 회원가입 섹션 -->
                <section class="signup-section">
                    <h2 class="section-title">회원가입</h2>
                    
                    <!-- 회원가입 폼 -->
                    <form class="signup-form" id="signupForm">
                        
                        <!-- 이메일 입력 -->
                        <div class="form-group">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" id="email" name="email"
                                   class="form-input" placeholder="이메일을 입력하세요" required>
                            <span class="error-message" id="emailError"></span>
                        </div>
                    
                        <!-- 비밀번호 입력 -->
                        <div class="form-group">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" id="password" name="password"
                                   class="form-input" placeholder="비밀번호를 입력하세요" required>
                            <span class="error-message" id="passwordError"></span>
                        </div>
                        
                        <!-- 비밀번호 확인 -->
                        <div class="form-group">
                            <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                            <input type="password" id="passwordConfirm" name="passwordConfirm"
                                   class="form-input" placeholder="비밀번호를 한번 더 입력하세요" required>
                            <span class="error-message" id="passwordConfirmError"></span>
                        </div>
                        
                        <!-- 닉네임 입력 -->
                        <div class="form-group">
                            <label for="nickname" class="form-label">닉네임</label>
                            <input type="text" id="nickname" name="nickname"
                                   class="form-input" placeholder="닉네임을 입력해 주세요" 
                                   maxlength="10" required>
                            <span class="error-message" id="nicknameError"></span>
                        </div>
                        
                        <!-- 프로필 사진 업로드 -->
                        <div class="form-group">
                            <label class="form-label">프로필 사진</label>
                            
                            <!-- 파일 선택 버튼 -->
                            <div class="profile-upload">
                                <button type="button" class="btn-file-select" id="fileSelectButton">
                                    파일 선택
                                </button>
                                <span class="file-name" id="fileName">선택된 파일 없음</span>
                                
                                <!-- 실제 파일 input (숨김) -->
                                <input type="file" id="profileImage" name="profileImage"
                                       accept="image/*" style="display: none;">
                            </div>
                            
                            <span class="error-message" id="imageError"></span>
                        </div>
                        
                        <!-- 회원가입 버튼 -->
                        <button type="submit" class="btn-signup" id="signupButton" disabled>
                            회원 가입
                        </button>
                    </form>

                    <!-- 로그인 링크 -->
                    <div class="login-link">
                        <a href="/index.html" class="link-text">로그인 하러가기</a>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 회원가입 JS 로드 -->
    <script type="module" src="../js/pages/signup.js"></script>
</body>
</html>
