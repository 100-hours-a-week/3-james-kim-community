<!-- /public/pages/login.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 로그인/회원가입</title>

    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>

    <!-- 통합 인증 페이지 전용 CSS -->
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body>
    <!-- 메인 컨테이너 -->
    <main class="login">
        <div class="login__content">
            <!-- 헤더: 브랜드 + 이미지 -->
            <header class="login__img">
                <h1 class="login__brand">KTB 커뮤니티</h1>
                <img src="https://image.freepik.com/free-vector/code-typing-concept-illustration_114360-3581.jpg" alt="user login">
            </header>

            <!-- 폼 섹션 -->
            <section class="login__forms">
                <!-- 로그인 폼 -->
                <form class="login__register" id="loginForm">
                    <h2 class="login__title">Sign In</h2>

                    <!-- 이메일 입력 -->
                    <div class="login__box">
                        <i class='bx bx-user login__icon'></i>
                        <input type="email" id="email" name="email" placeholder="이메일" 
                                class="login__input" maxlength="200" required>
                    </div>
                    <span class="error-message" id="emailError"></span>

                    <!-- 비밀번호 입력 -->
                    <div class="login__box">
                        <i class='bx bx-lock login__icon'></i>
                        <input type="password" id="password" name="password" placeholder="비밀번호" 
                                class="login__input" maxlength="20" required>
                    </div>
                    <span class="error-message" id="passwordError"></span>

                    <!-- 로그인 버튼 -->
                    <button type="submit" class="login__button" id="loginButton">Sign In</button>

                    <div>
                        <span class="login__account login__account--account">계정이 없으신가요?</span>
                        <span class="login__signin login__signin--signup" id="sign-up">회원가입</span>
                    </div>

                    <!-- 이용약관 및 개인정보처리방침 링크 -->
                    <div class="policy-links">
                        <a href="http://localhost:8080/policy/terms" class="policy-link">커뮤니티 이용약관</a>
                        <span class="policy-divider">|</span>
                        <a href="http://localhost:8080/policy/privacy" class="policy-link">개인정보처리방침</a>
                    </div>
                </form>

                <!-- 회원가입 폼 -->
                <form class="login__create none" id="signupForm">
                    <h2 class="login__title">Create Account</h2>

                    <!-- 이메일 입력 -->
                    <div class="login__box">
                        <i class='bx bx-user login__icon'></i>
                        <input type="email" id="signupEmail" name="email" placeholder="이메일" 
                                class="login__input" maxlength="200" required>
                    </div>
                    <span class="error-message" id="signupEmailError"></span>

                    <!-- 비밀번호 입력 -->
                    <div class="login__box">
                        <i class='bx bx-lock login__icon'></i>
                        <input type="password" id="signupPassword" name="password" placeholder="비밀번호" 
                                class="login__input" maxlength="20" required>
                    </div>
                    <span class="error-message" id="signupPasswordError"></span>

                    <!-- 비밀번호 확인 -->
                    <div class="login__box">
                        <i class='bx bx-lock-alt login__icon'></i>
                        <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호 확인" 
                                class="login__input" maxlength="20" required>
                    </div>
                    <span class="error-message" id="passwordConfirmError"></span>

                    <!-- 닉네임 입력 -->
                    <div class="login__box">
                        <i class='bx bx-user-circle login__icon'></i>
                        <input type="text" id="nickname" name="nickname" placeholder="닉네임 (1~10자)" 
                                class="login__input" maxlength="10" required>
                    </div>
                    <span class="error-message" id="nicknameError"></span>

                    <!-- 프로필 이미지 업로드 -->
                    <div class="login__box login__box--file">
                        <i class='bx bx-image login__icon'></i>
                        <input type="file" id="profileImage" class="hidden-file-input" accept="image/*">
                        <button type="button" class="btn-file-select" id="fileSelectButton">
                            파일 선택
                        </button>
                        <span class="file-name" id="fileName">선택된 파일 없음</span>
                    </div>
                    <span class="error-message" id="imageError"></span>

                    <!-- 회원가입 버튼 -->
                    <button type="submit" class="login__button" id="signupButton" disabled>회원가입</button>

                    <div>
                        <span class="login__account login__account--account">이미 계정이 있으신가요?</span>
                        <span class="login__signup login__signup--signup" id="sign-in">로그인</span>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- 통합 인증 JS 로드 -->
    <script type="module" src="../js/pages/auth.js"></script>
</body>
</html>
