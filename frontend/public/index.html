<!-- /public/index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 게시글 목록</title>

    <!-- 공통 CSS 로드 -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">

    <!-- 필요한 컴포넌트 CSS 로드 -->
    <link rel="stylesheet" href="../css/components/header.css">
    <link rel="stylesheet" href="../css/components/dropdown.css">
    <link rel="stylesheet" href="../css/components/login-prompt-modal.css">

    <!-- 페이지 전용 CSS 로드 -->
    <link rel="stylesheet" href="../css/pages/posts.css">
</head>
<body>
    <!-- 전체 배경 -->
    <div class="app-background">

        <!-- 중앙 컨텐츠 컨테이너 -->
        <div class="mobile-container">

            <!-- Header는 JS로 동적 생성됨 -->
            
            <!-- 메인 콘텐츠 영역 -->
            <main class="main-content">

                <!-- 환영 메시지 영역 -->
                <section class="welcome-section">
                    <p class="welcome-text">안녕하세요,</p>
                    <p class="welcome-text">와글와글 게시판 입니다.</p>
                </section>

                <!-- 게시글 작성 버튼 -->
                <section class="write-section">
                    <button class="btn-write" id="writeButton">게시글 작성</button>
                </section>

                <!-- 게시글 목록 -->
                <section class="posts-section">
                    <!-- 게시글 리스트 (JS로 동적 생성) -->
                    <div class="posts-list" id="postsList">
                        <!-- 게시글 카드가 여기에 동적으로 추가 -->
                    </div>

                    <!-- 로딩 인디케이터 (인피니티 스크롤용) -->
                    <div class="loading-indicator hidden" id="loadingIndicator">
                        <p>게시글을 불러오는 중..</p>
                    </div>

                    <!-- 더 이상 게시글 없음 -->
                    <div class="no-more-posts hidden" id="noMorePosts">
                        <p>마지막 게시글입니다</p>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- 로그인 유도 모달은 JS로 동적 생성 -->

    <!-- JS 로드 -->
    <script type="module" src="./js/pages/posts.js"></script>
</body>
</html>
